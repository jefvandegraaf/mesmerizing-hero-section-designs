<!doctype html>
<!--
  Heroshima hero
  A pixel bomb falls, explodes at the bottom, and a mushroom cloud rises beside your text.

  Hero designs by Jef van de Graaf, free to use · jefvandegraaf.com/resources/hero-designs/

  How to use: open this file in a browser. Change the colours in --hl-acc and --hl-acc2 (RGB values)
  and the strength in --i. The headline, supporting line and buttons are plain HTML.
  Needs no libraries. The animation stops for people who prefer reduced motion.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroshima hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body { margin: 0; }
.hl {
  --hl-bg: #fbfbfa; --hl-fg: #101010; --hl-muted: #545458; --hl-rgb: 16,16,16;
  --hl-acc: 232,17,45; --hl-acc2: 255,221,0;
  --hl-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --hl-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  --hl-jp: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
  --hl-cw: 1040px; --hl-pad: 48px;
  --L: max(16px, calc((100% - var(--hl-cw)) / 2));
  --i: 1;
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--hl-bg); color: var(--hl-fg);
  font: 400 16px/1.6 var(--hl-sans); text-align: left;
  -webkit-font-smoothing: antialiased;
}
.hl[data-theme="dark"] { --hl-bg: #050505; --hl-fg: #f6f6f4; --hl-muted: #a4a4a9; --hl-rgb: 255,255,255; color-scheme: dark; }
.hl *, .hl *::before, .hl *::after { box-sizing: border-box; }
.hl-layer { position: absolute; inset: 0; pointer-events: none; }
.hl-bg { z-index: 0; opacity: min(1, calc(var(--o, .6) * var(--i))); }
.hl-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hl-inner { position: relative; z-index: 2; padding-inline: calc(var(--L) + var(--hl-pad)); }
.hl-nav { height: 64px; display: flex; align-items: center; gap: 28px; font-size: 14px; }
.hl-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; margin-right: auto; white-space: nowrap; }
.hl-logo { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(140deg, rgba(var(--hl-rgb),.5), rgba(var(--hl-rgb),.15)); }
.hl-links { display: flex; gap: 26px; color: var(--hl-muted); }
.hl-navbtn { font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(var(--hl-rgb),.25); white-space: nowrap; }
.hl-hero { padding-block: 116px 120px; display: grid; gap: 22px; justify-items: start; }
.hl .hl-tag { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 -6px; font: 500 15px/1.4 var(--hl-sans); color: var(--hl-muted); }
.hl-tag svg { width: 16px; height: 16px; }
.hl .hl-title { margin: 0; max-width: 760px; font: 500 clamp(40px, 5vw, 64px)/1.1 var(--hl-sans); letter-spacing: -.02em; color: var(--hl-fg); text-wrap: balance; }
.hl .hl-lede { margin: 0; max-width: 48ch; font: 400 22px/1.5 var(--hl-sans); color: var(--hl-muted); text-wrap: pretty; }
.hl-center .hl-hero { justify-items: center; text-align: center; }
.hl-center .hl-actions { justify-content: center; }
.hl-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.hl .hl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 22px; border: 1px solid transparent; border-radius: 10px; font: 600 16px/1 var(--hl-sans); white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color .2s ease, border-color .2s ease, opacity .2s ease; }
.hl .hl-btn--primary { background: var(--hl-fg); color: var(--hl-bg); }
.hl .hl-btn--primary:hover { opacity: .86; }
.hl .hl-btn--secondary { background: var(--hl-bg); color: var(--hl-fg); border-color: rgba(var(--hl-rgb),.3); }
.hl .hl-btn--secondary:hover { border-color: var(--hl-fg); }
.hl-btn svg { width: 18px; height: 18px; transition: transform .2s ease; }
.hl-btn:hover svg { transform: translateX(4px); }
.hl .hl-btn:focus-visible { outline: 2px solid rgb(var(--hl-acc)); outline-offset: 3px; }
@media (max-width: 760px) {
  .hl .hl-title { font-size: min(40px, calc((100vw - 90px) / 8.3)); }
  .hl .hl-lede { font-size: 16px; }
  .hl-links { display: none; }
}
@media (max-width: 640px) {
  .hl { --hl-pad: 20px; }
  .hl-hero { padding-block: 96px 104px; }
  .hl-actions { flex-direction: column; align-items: stretch; width: min(100%, 300px); }
  .hl-btn--secondary { order: -1; }
}
.hl-bg--heroshima { --o: 1; }
/* the lede stops about 3/5 across so it never runs into the cloud; balanced lines, no orphans */
.hl:has(.hl-bg--heroshima) .hl-lede { max-width: min(100%, max(55%, 520px)); text-wrap: balance; }
@media (prefers-reduced-motion: reduce) {
  .hl-hz-pool, .hl-hz-core, .hl-caret, .hl-ring, .hl-bg--heat canvas, .hl-r-red .hl-rails .hl-n1, .hl-r-red .hl-rails .hl-b1, .hl-flicker .hl-grain, .hl-flicker .hl-hz-grain, .hl-tm .hl-cur, .hl-crt-roll, .hl-crt-glow, .hl-mq { animation: none; }
  .hl-ring { opacity: .5; transform: translate(-50%,-50%) scale(6); }
  .hl-ds-i span::after, .hl-pm path, .hl-pm .hl-pring, .hl-pm text, .hl-pm .hl-pfill, .hl-cg-band { transition: none; }
}
/* Centred text sits over the busiest part of most designs: a soft patch of background colour (a scrim) keeps it readable. */
.hl-center .hl-hero { position: relative; }
.hl-center .hl-hero::before { content: ""; position: absolute; inset: -48px -96px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--hl-bg) 92%, transparent) 55%, transparent); }
/* On wider screens the copy sits on the frame's centre line, however many lines the headline takes. */
@media (min-width: 761px) {
  body > .hl { display: flex; flex-direction: column; }
  body > .hl > .hl-inner { flex: 1; display: flex; flex-direction: column; }
  body > .hl .hl-hero { flex: 1; align-content: center; padding-block: 40px 104px; } /* the 64px header above evens it out */
}
/* The supporting line breaks into two even lines on wider screens. */
@media (min-width: 761px) { .hl .hl-lede { text-wrap: balance; } }
/* The logo and menu sit a little wider than the headline column. */
@media (min-width: 761px) { .hl-nav { margin-inline: calc(-1 * min(96px, max(16px, (100vw - var(--hl-cw)) / 2) + var(--hl-pad) - 24px)); } }
/* Fills the window here. Remove this rule to let the hero take its own height. */
body > .hl { min-height: 100vh; }
</style>
</head>
<body>
<section id="hero-heroshima" class="hl" data-theme="dark" style="--hl-acc: 232, 17, 45; --hl-acc2: 255, 221, 0; --i: 0.6;">
<div class="hl-layer hl-bg hl-bg--heroshima" aria-hidden="true"></div>
<div class="hl-inner">
<div class="hl-nav"><span class="hl-brand"><span class="hl-logo"></span>Your Brand</span><span class="hl-links"><span>Product</span><span>Pricing</span><span>Blog</span><span>About</span></span><span class="hl-navbtn">Contact</span></div>
<div class="hl-hero"><span class="hl-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Dither</span>
<h1 class="hl-title">Your headline, then the blast</h1>
<p class="hl-lede">A pixel bomb falls, explodes at the bottom, and a mushroom cloud rises beside your text.</p><div class="hl-actions">
<a class="hl-btn hl-btn--primary" href="#">Primary CTA</a>
<a class="hl-btn hl-btn--secondary" href="#">Secondary CTA <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></div></div></div>
</section>

        var bj = Math.floor(yTop) + r * z + zy, bi = x0 + col * z + zx;
        if (bj < 0 || bj >= h || bi < 0 || bi >= w) continue;
        var bo = (bj * w + bi) * 4; d[bo] = cc[0]; d[bo + 1] = cc[1]; d[bo + 2] = cc[2]; d[bo + 3] = 255;
      }
    }
    // the chapter number on the body, under the red band
    if (LABEL) {
      var fz = 2, lw = -fz; for (var lg = 0; lg < LABEL.length; lg++) lw += ((GLYPH[LABEL[lg]] || ["..."])[0].length + 1) * fz;
      var lx0 = 0, lx = x0 + Math.round((bw - lw) / 2), ly = Math.floor(yTop) + 8 * z + Math.round((6 * z - 5 * fz) / 2);
      for (var g = 0; g < LABEL.length; g++) {
        var gl = GLYPH[LABEL[g]]; if (!gl) continue;
        for (var gr = 0; gr < 5; gr++) for (var gc = 0; gc < gl[0].length; gc++) {
          if (gl[gr][gc] !== "1") continue;
          for (var fy = 0; fy < fz; fy++) for (var fx = 0; fx < fz; fx++) {
            var pj = ly + gr * fz + fy, pi = lx + (lx0 + gc) * fz + fx;
            if (pj < 0 || pj >= h || pi < 0 || pi >= w) continue;
            var po = (pj * w + pi) * 4; d[po] = 24; d[po + 1] = 24; d[po + 2] = 22; d[po + 3] = 255;
          }
        }
        lx0 += gl[0].length + 1;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function frame(t, dt) {
    if (t < DROP) return drop(t);
    t -= DROP;
    var g = 1 - Math.exp(-t / 2.4);
    var vc = .2 + .56 * g, rx = .12 + .5 * g, ry = .08 + .24 * g;
    var rxb = .1 + 1.05 * g, ryb = .04 + .08 * g;
    var k = .74 + .26 * Math.exp(-t / 5) + .04 * Math.sin(t * 7.3) * Math.sin(t * 3.1);
    var rw = t * .42, swA = Math.exp(-t / 2.6), swW = .0006 + t * .0005;
    var flash = t < 1.1 ? Math.pow(1 - t / 1.1, 3) : 0;
    var wil = sm(.8, 2.2, t) * (1 - sm(4, 8, t)), wilR = .12 + .25 * g, wilV = vc * .62;
    var d = img.data, inv = 1 / S, topFade = .55 * H;
    new Uint32Array(d.buffer).fill(0); FH.fill(0); FS.fill(0);
    // only visit cells that can light up: rows near the cloud, columns inside the widest effect on that row
    // 1) the shape on the coarse grid (grid points every CP px)
    for (var j = 0; j < chh; j++) {
      var y = j * CP, v = (gy - y) * inv;
      var i0 = 0, i1 = cw;
      if (!flash) {
        if (v > vc + 1.85 || v < -.07) continue; // the glow reaches dv 1.79 (exp > .01)
        var um = 1.9;
        if (v < ryb * 1.6) um = Math.max(um, rxb * 1.3);
        if (v < .02) um = Math.max(um, rxb * 2.4);
        if (v < .15 && swA > .02) um = Math.max(um, rw + .2);
        i0 = Math.max(0, Math.floor((cx - um * S) / CP) - 1); i1 = Math.min(cw, Math.ceil((cx + um * S) / CP) + 2);
      }
      for (var i = i0; i < i1; i++) {
        var kk = j * cw + i, x = i * CP, u = (x - cx) * inv;
        var heat = 0, smoke = 0;
        // sky glow around the cap
        // the glow is broken up by drifting noise so its outline reads as smoke, not an oval
        var sk = Math.exp(-(u * u / .75 + (v - vc) * (v - vc) / .7)) * .3 * k;
        if (sk > .01) { var nz = fbm(u * 2.2 + t * .03 + 11.3, v * 2.2 - t * .06 + 5.1); sk = Math.max(0, sk * nz * nz * 2.6 - .03); }
        else sk = 0;
        heat = sk * sm(0, topFade, y); // eases out well before the top of the hero
        if (v < 0) {
          // ground: a lit strip under the blast
          if (v > -.07) heat = Math.max(heat * .4, Math.exp(-u * u / (rxb * rxb * 1.6)) * .34 * (1 + v / .07) * k);
        } else {
          // cap
          var dx = u / rx, dy = (v - vc) / ry, r2 = dx * dx + dy * dy;
          if (r2 < 2.4) {
            var sg = dx < 0 ? -1 : 1;
            var n = fbm(dx * 2.2 + sg * t * .14 + 3.7, dy * 2.6 - t * .26 + 7.1);
            var cd = 1 - r2 + (n - .5) * 1.0;
            var cap = sm(0, .25, cd);
            var core = Math.exp(-(dx * dx * 1.1 + (dy + .35) * (dy + .35) * 2.2));
            heat = Math.max(heat, cap * (.42 + .78 * core) * k);
            smoke = Math.max(smoke, (sm(-.4, 0, cd) - cap) * .9);
          }
          // stem
          if (v < vc) {
            var q = v / vc, sw = (.035 + .06 * g) * (1 + 1.6 * q * q * q);
            if (Math.abs(u) < sw * 2.2) {
              var ns = fbm(u * 14 + 1.9, v * 5 - t * .6);
              var sd = 1 - Math.abs(u) / sw + (ns - .5) * .9;
              var st = sm(0, .3, sd);
              heat = Math.max(heat, st * (.4 + .4 * q) * k);
              smoke = Math.max(smoke, (sm(-.5, 0, sd) - st) * .6);
            }
          }
          // ground skirt of dust and fire
          if (v < ryb * 1.6 && Math.abs(u) < rxb * 1.3) {
            var nb = fbm(u * 5 - (u < 0 ? -1 : 1) * t * .1 + 4.4, v * 9 + 2.2);
            var bd = 1 - (u / rxb) * (u / rxb) - (v / ryb) * (v / ryb) + (nb - .5) * .9;
            var base = sm(0, .3, bd);
            heat = Math.max(heat, base * (.28 + .42 * Math.exp(-(u / rxb) * (u / rxb) * 3)) * k);
            smoke = Math.max(smoke, base * .8, sm(-.4, 0, bd) * .5);
          }
          // condensation ring around the stem
          if (wil > 0) {
            var wd = Math.abs(Math.hypot(u / wilR, (v - wilV) / (wilR * .22)) - 1);
            if (wd < .2) smoke = Math.max(smoke, (1 - wd / .2) * wil * (.6 + .4 * noise(u * 30, t)));
          }
        }
        // shockwave along the ground
        if (swA > .02 && v > -.03 && v < .15) {
          var sd2 = Math.hypot(u, v * 3.4) - rw;
          heat = Math.max(heat, Math.exp(-(sd2 * sd2) / swW) * swA * .95 * (1 - sm(.04, .15, v)));
        }
        if (flash > 0) heat += flash * 1.5 * Math.exp(-(u * u + (v - .15) * (v - .15)) / (.2 + t * .8));
        FH[kk] = heat; FS[kk] = smoke;
      }
    }
    // 2) dither every fine cell from the bilinear field
    for (j = 0; j < h; j++) {
      var gyf = ((j + .5) * P) / CP, jj = gyf | 0, fy = gyf - jj, r0 = jj * cw, r1 = r0 + cw;
      for (i = 0; i < w; i++) {
        var gxf = ((i + .5) * P) / CP, ii = gxf | 0, fx = gxf - ii;
        var a00 = r0 + ii, a10 = r1 + ii;
        var ht = (FH[a00] * (1 - fx) + FH[a00 + 1] * fx) * (1 - fy) + (FH[a10] * (1 - fx) + FH[a10 + 1] * fx) * fy;
        var sm2 = (FS[a00] * (1 - fx) + FS[a00 + 1] * fx) * (1 - fy) + (FS[a10] * (1 - fx) + FS[a10 + 1] * fx) * fy;
        if (ht < .015 && sm2 < .06) continue;
        var kf = j * w + i, m = mask[kf];
        // keep the copy readable: fade, not a cut-off, so the bright flash never draws a box
        ht = Math.min(ht * (G0 + (1 - G0) * m * m), G1 + (1 - G1) * m);
        sm2 *= .25 + .75 * m;
        var f = (ht > 1 ? 1 : ht) * 4, lv = f | 0, o = kf * 4;
        if (f - lv > thr[kf]) lv++;
        if (lv > 4) lv = 4;
        if (lv > 0) { var c = PAL[lv]; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
        else if (sm2 * .55 > thr[kf]) { d[o] = SMOKE[0]; d[o + 1] = SMOKE[1]; d[o + 2] = SMOKE[2]; d[o + 3] = SMOKE[3]; }
      }
    }
    // 3) impact: the bottom edge cracks open from the blast point, white hot, racing outward both ways,
    // then cools to the underglow (yellow under the cloud, red toward the ends)
    var front = t * 1900, span = Math.max(cx, W - cx), cool = Math.exp(-t / 1.6), rows = Math.ceil(46 / P);
    for (j = h - rows; j < h; j++) {
      var hp = (h - 1 - j) * P; // px above the edge
      for (i = 0; i < w; i++) {
        var xx = (i + .5) * P, dd = Math.abs(xx - cx);
        if (dd > front) continue;
        var along = dd / span; // 0 at the blast, 1 at the far end
        var lineH = (.62 + .43 * cool) * (1 - .45 * along) + .5 * Math.exp(-Math.pow((front - dd) / 40, 2)) * cool; // hot front edge
        var lh = lineH * (hp < P * 1.5 ? 1 : Math.exp(-(hp - P) / (10 + 14 * cool)));
        var kf = j * w + i;
        if (hp > 6) lh *= .35 + .65 * mask[kf];
        var f = (lh > 1 ? 1 : lh) * 4, lv = f | 0, o = kf * 4;
        if (f - lv > thr[kf]) lv++;
        if (lv > 4) lv = 4;
        if (lv > 0 && (d[o + 3] === 0 || lv >= 2)) { var c = PAL[lv]; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
      }
    }
    // sparks thrown up where the edge cracks open
    if (!reduce && front < span + 200) for (var sp = 0; sp < 2; sp++) {
      var sd = Math.random() < .5 ? -1 : 1;
      sparks.push({ x: cx + sd * front * (.85 + Math.random() * .15), y: H - 2, vx: sd * (60 + Math.random() * 160), vy: -(120 + Math.random() * 260), life: .5 + Math.random() * .7, age: 0 });
    }
    for (var q2 = sparks.length - 1; q2 >= 0; q2--) {
      var sk2 = sparks[q2]; sk2.age += dt; sk2.x += sk2.vx * dt; sk2.y += sk2.vy * dt; sk2.vy += 520 * dt;
      if (sk2.age > sk2.life || sk2.y > H) { sparks.splice(q2, 1); continue; }
      var si = (sk2.x / P) | 0, sj = (sk2.y / P) | 0; if (si < 0 || si >= w || sj < 0 || sj >= h) continue;
      var sc = PAL[sk2.age / sk2.life < .3 ? 4 : sk2.age / sk2.life < .65 ? 3 : 2], so2 = (sj * w + si) * 4;
      d[so2] = sc[0]; d[so2 + 1] = sc[1]; d[so2 + 2] = sc[2]; d[so2 + 3] = 255;
    }

    // embers
    if (!reduce) {
      // a storm of embers: they rise past the cloud into the dark, swirl, and cool yellow > red > ember
      var want = t < 6 ? 220 : 130;
      while (embers.length < want) spawn(t, g);
      for (var e = embers.length - 1; e >= 0; e--) {
        var p = embers[e];
        p.age += dt; p.u += p.vu * dt; p.v += p.vv * dt;
        p.vu += ((Math.random() - .5) * .06 + Math.sin(p.v * 9 + t * 1.3) * .02) * dt;
        if (p.age > p.life) { embers.splice(e, 1); continue; }
        var ei = Math.round((cx + p.u * S) / P), ej = Math.round((gy - p.v * S) / P);
        if (ei < 0 || ej < 0 || ei >= w - 1 || ej >= h - 1) continue;
        var ek = ej * w + ei, mk = mask[ek];
        var life = p.age / p.life, yy = ej * P;
        // fade out toward the top of the hero and near the copy, by thinning (dithered), never a hard stop
        var keep = Math.min(1, yy / (H * .3)) * (mk > .5 ? 1 : mk * 2) * (life > .8 ? (1 - life) * 5 : 1);
        if (keep < thr[ek]) continue;
        var col = PAL[life < .3 ? 3 : life < .7 ? 2 : 1], cells = p.big ? [0, 1, w, w + 1] : [0];
        for (var c2 = 0; c2 < cells.length; c2++) { var eo = (ek + cells[c2]) * 4; d[eo] = col[0]; d[eo + 1] = col[1]; d[eo + 2] = col[2]; d[eo + 3] = 255; }
      }
    }
    ctx.putImageData(img, 0, 0);
  }


  var clock = null, lastTick = 0, shown = 0;
  function draw() { if (img) frame(reduce ? 14 : shown, 0); }
  colours();
  return {
    resize: function () { if (size()) draw(); },
    retheme: function () { colours(); draw(); },
    tick: reduce ? null : function (now) {
      if (!img) return;
      if (clock === null) clock = now;
      if (now - lastTick < 50) return;
      var dt = lastTick ? Math.min(.1, (now - lastTick) / 1000) : 0;
      lastTick = now; shown = (now - clock) / 1000;
      frame(shown, dt);
    },
    replay: function () { clock = null; lastTick = 0; shown = 0; embers.length = 0; sparks.length = 0; draw(); }
  };
};
var api = hlMount(document.getElementById('hero-heroshima'), concept);
})();
</script>
